[pytest]
testpaths = tests
markers =
    slow: tests that perform extensive disk I/O, stress testing, or sleep (>0.5s)
    promos: tests for Inflyte, Trackstack, and promo reviewing
    audio: tests for libsonare, waveform, and audio metadata
    storage: tests for SQLite bakkis.db and encryption
    session: tests for sorting queue, history, and undo
    server: tests for local HTTP API and streaming
    frontend: tests for static web assets and ES module resolution
    pipeline: tests for lookahead warmup engine and prefetch pipeline

