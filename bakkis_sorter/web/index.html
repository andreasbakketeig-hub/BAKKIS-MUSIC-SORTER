<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAKKIS MUSIC SORTER</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="is-empty">
<header class="topbar">
  <div class="brand">BAKKIS</div>
  <div class="folder" id="folder-name" title=""></div>
  <select id="preset-select" class="preset-select" aria-label="Active preset"></select>
  <div class="mode-switch" role="tablist" aria-label="Sorting mode">
    <button type="button" data-mode="swipe" role="tab">Swipe</button>
    <button type="button" data-mode="grid" role="tab">Grid</button>
  </div>
  <div class="top-progress" aria-hidden="true"><div id="top-progress-fill"></div></div>
  <div class="count" id="count"></div>
  <div class="top-icons">
    <button type="button" class="icon-btn" id="btn-queue" title="Queue (Q)" aria-label="Queue">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-help" title="Shortcuts (H)" aria-label="Shortcuts">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <!-- Onboarding / empty state -->
  <section class="screen screen-empty" id="screen-empty">
    <div class="empty-inner">
      <h1>Sort your music, one track at a time</h1>
      <button type="button" class="primary-btn" id="btn-choose">Choose music folder</button>
      <p class="muted">or drop a folder anywhere in this window</p>
      <p class="muted small">Sorted files go to <code>BAKKIS_SORTED/…</code> inside the folder you choose. Nothing is deleted.</p>
      <p class="warn small" id="empty-message" hidden></p>
    </div>
  </section>

  <!-- Scanning -->
  <section class="screen screen-scanning" id="screen-scanning">
    <div class="empty-inner">
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="scan-text">Scanning…</h2>
      <p class="muted small" id="scan-root"></p>
    </div>
  </section>

  <!-- Player -->
  <section class="screen screen-player" id="screen-player">
    <div class="card" id="card">
      <div class="cover" id="cover"><img id="cover-img" alt=""><span id="cover-fallback"></span></div>
      <div class="card-text">
        <div class="title-wrap"><div class="title" id="title"></div></div>
        <div class="artist" id="artist"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="drag-hint" id="drag-hint"></div>
    </div>

    <div class="wave-block">
      <div class="wave" id="wave">
        <canvas id="wave-canvas"></canvas>
        <div class="wave-hover" id="wave-hover" hidden></div>
      </div>
      <div class="markers" id="markers"></div>
      <div class="transport">
        <button type="button" class="icon-btn play-btn" id="btn-play" aria-label="Play/pause (Space)">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
        </button>
        <div class="time" id="time">0:00 / 0:00</div>
        <div class="spacer"></div>
        <label class="volume" title="Volume">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
        </label>
      </div>
    </div>

    <div class="tiles tiles-swipe" id="tiles-swipe"></div>
    <div class="tiles tiles-grid" id="tiles-grid"></div>
  </section>

  <!-- Session end -->
  <section class="screen screen-done" id="screen-done">
    <div class="empty-inner">
      <h1>All done</h1>
      <div class="done-stats" id="done-stats"></div>
      <div class="row-btns">
        <button type="button" class="ghost-btn" id="btn-done-undo">Undo last (Z)</button>
        <button type="button" class="primary-btn" id="btn-done-load">Load another folder</button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="hints" id="hints"></div>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="row-btns" id="modal-buttons"></div>
  </div>
</div>

<div class="drop-overlay" id="drop-overlay" hidden><div>Drop folder to load</div></div>

<script src="/static/app.js"></script>
</body>
</html>
